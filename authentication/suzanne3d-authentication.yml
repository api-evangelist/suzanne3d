  in: header
  header: Authorization
  format: Bearer sznn_test_xxx | Bearer sznn_live_xxx
  key_prefixes:
    sandbox: sznn_test_
    production: sznn_live_
  statement: 'Every request requires a Bearer token issued to your account. Keys start with sznn_test_ (sandbox)
    or sznn_live_ (production). Treat them like a password: server-side only, never in client code.'
  issued_from: https://console.suzanne3d.com/dashboard
  applies_to: all operations
  docs: https://console.suzanne3d.com/documentation/authentication
errors:
