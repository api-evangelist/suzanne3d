servers:
- url: https://api.suzanne3d.com
security:
- bearer: []
tags:
- name: Uploads
  description: Presigned image uploads
paths:
  /v1/uploads:
    post:
      operationId: createUpload
      tags:
      - Uploads
      summary: Create a presigned upload URL
      description: Get a 5-minute presigned PUT URL so the client uploads a JPEG/PNG directly to S3 (bypasses the API Gateway 10 MB body limit). Empty body, just the auth header. Then PUT the image to upload_url WITHOUT a Content-Type header. The object auto-expires after 7 days.
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreated'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'internal: could not generate a presigned URL; retry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://console.suzanne3d.com/documentation/uploads
      x-evidence:
        kind: documentation
        response_status_on_page: 'Response: 201 Created'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              enum:
              - invalid_request
              - auth
              - rate_limit
              - internal
              - vendor
            code:
              type: string
              description: machine-readable string
            message:
              type: string
            request_id:
              type: string
              description: Always include request_id in support requests.
    UploadCreated:
      type: object
      properties:
        upload_id:
          type: string
          description: upl_<uuid>
        upload_url:
          type: string
          format: uri
          description: Presigned S3 PUT URL, valid 5 minutes. Do NOT send a Content-Type header on the PUT.
        expires_at:
          type: string
          format: date-time
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <key>. Keys start with sznn_test_ (sandbox) or sznn_live_ (production). Server-side only.'
