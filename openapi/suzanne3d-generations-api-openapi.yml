    reason: generate-contract-from-docs.py kept 0 operations from the six endpoint pages and its collapse step merged the sibling literal paths /v1/generations/text-to-3d + /v1/generations/photo-to-3d into /v1/generations/{generationid} and /v1/uploads into /v1/{v1id}; those paths exist on no page. The operations below were re-derived one per endpoint page, each METHOD + path gated verbatim against that page; schemas carry only the fields the page example responses show.
servers:
- url: https://api.suzanne3d.com
security:
- bearer: []
tags:
- name: Generations
  description: Submit text-to-3D and photo-to-3D jobs
paths:
  /v1/generations/text-to-3d:
    post:
      operationId: createTextTo3dGeneration
      tags:
      - Generations
      summary: Submit a text-to-3D job
      description: 'Submit a text prompt and get back a job_id you can poll until the mesh is ready. model: sculptor, or atelier for premium PBR + detailed textures; capture is photo-only and not valid here.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Pass Idempotency-Key: <your-random-key> on any POST /v1/generations/... request to make the call safe to retry. Same key within 24 h returns the original response; different body + same key -> 409 idempotency_key_conflict. Recommended: a UUID per logical request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextTo3dRequest'
      responses:
        '202':
          description: '202 Accepted: the job is queued. Poll GET /v1/jobs/{job_id} until status is done, failed, or cancelled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          description: validation_error | missing_body | invalid_param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: idempotency_key_conflict | concurrent_limit_reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://console.suzanne3d.com/documentation/text-to-3d
      x-evidence:
        kind: documentation
        response_status_on_page: 'Response: 202 Accepted'
  /v1/generations/photo-to-3d:
    post:
      operationId: createPhotoTo3dGeneration
      tags:
      - Generations
      summary: Submit a photo-to-3D job
      description: 'Submit 1-4 photos and get back a job_id. Two ways to provide images, pick exactly one: images_upload_ids (upload-then-reference, up to 4 views: front required; back/left/right optional for sculptor; capture requires all four) or images_inline (single-photo base64, <= ~5 MB). Single-photo and multi-view auto-route inside the Atelier2 engine.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Pass Idempotency-Key: <your-random-key> on any POST /v1/generations/... request to make the call safe to retry. Same key within 24 h returns the original response; different body + same key -> 409 idempotency_key_conflict. Recommended: a UUID per logical request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoTo3dRequest'
      responses:
        '202':
          description: '202 Accepted: the job is queued. Poll GET /v1/jobs/{job_id} until status is done, failed, or cancelled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          description: validation_error | inline_multi_photo_not_supported | invalid_param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: concurrent_limit_reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://console.suzanne3d.com/documentation/photo-to-3d
      x-evidence:
        kind: documentation
        response_status_on_page: 'Response: 202 Accepted'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              enum:
              - invalid_request
              - auth
              - rate_limit
              - internal
              - vendor
            code:
              type: string
              description: machine-readable string
            message:
              type: string
            request_id:
              type: string
              description: Always include request_id in support requests.
    TextTo3dRequest:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          enum:
          - sculptor
          - atelier
          - capture
          description: Stable named model; all three run on the Atelier2 engine.
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: 1-4000 characters describing the mesh you want.
        params:
          type: object
          description: Generation Parameters (apply to text-to-3D and photo-to-3D).
          properties:
            faces:
              type: integer
              enum:
              - 200000
              - 500000
              - 1000000
              - 2000000
              default: 500000
              description: Target polygon count, chosen from a discrete menu. Values that do not apply to a given path are clamped to the closest supported value.
            pbr:
              type: boolean
              default: true
              description: Generate PBR textures (base color + metallic-roughness + normal). Disable for flat-shaded output.
            quad:
              type: boolean
              default: false
              description: When true, produces a quad-topology mesh (capped at 150000 faces, delivered as FBX).
            texture_quality:
              type: string
              enum:
              - standard
              - detailed
              description: '"detailed" for atelier, "standard" otherwise.'
        outputs:
          type: array
          items:
            type: string
            enum:
            - glb
            - obj
            - stl
            - fbx
          default:
          - glb
          description: Any subset of ["glb", "obj", "stl", "fbx"] (default ["glb"]).
    PhotoTo3dRequest:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          enum:
          - sculptor
          - atelier
          - capture
          description: Stable named model; all three run on the Atelier2 engine.
        images_upload_ids:
          type: object
          description: Upload-then-reference (recommended, supports up to 4 views). front is required; back / left / right are optional for sculptor; capture requires all four.
          properties:
            front:
              type: string
              description: upl_<uuid> from POST /v1/uploads
            back:
              type: string
              description: upl_<uuid> from POST /v1/uploads
            left:
              type: string
              description: upl_<uuid> from POST /v1/uploads
            right:
              type: string
              description: upl_<uuid> from POST /v1/uploads
        images_inline:
          type: object
          description: Inline base64 (single-photo only, <= ~5 MB). Multi-view inline is not supported.
          properties:
            front:
              type: string
              description: base64-jpeg-or-png
        params:
          type: object
          description: Generation Parameters (apply to text-to-3D and photo-to-3D).
          properties:
            faces:
              type: integer
              enum:
              - 200000
              - 500000
              - 1000000
              - 2000000
              default: 500000
              description: Target polygon count, chosen from a discrete menu. Values that do not apply to a given path are clamped to the closest supported value.
            pbr:
              type: boolean
              default: true
              description: Generate PBR textures (base color + metallic-roughness + normal). Disable for flat-shaded output.
            quad:
              type: boolean
              default: false
              description: When true, produces a quad-topology mesh (capped at 150000 faces, delivered as FBX).
            texture_quality:
              type: string
              enum:
              - standard
              - detailed
              description: '"detailed" for atelier, "standard" otherwise.'
        outputs:
          type: array
          items:
            type: string
            enum:
            - glb
            - obj
            - stl
            - fbx
          default:
          - glb
          description: Any subset of ["glb", "obj", "stl", "fbx"] (default ["glb"]).
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
          description: job_<uuid>
        status:
          type: string
          enum:
          - queued
        created_at:
          type: string
          format: date-time
        billable_amount_cents:
          type: integer
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <key>. Keys start with sznn_test_ (sandbox) or sznn_live_ (production). Server-side only.'
