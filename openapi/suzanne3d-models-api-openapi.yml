    date: '2026-10-07'
    by: enrichment pass (script-gated)
    reason: generate-contract-from-docs.py kept 0 operations from the six endpoint pages and its collapse step merged the sibling literal paths /v1/generations/text-to-3d + /v1/generations/photo-to-3d into /v1/generations/{generationid} and /v1/uploads into /v1/{v1id}; those paths exist on no page. The operations below were re-derived one per endpoint page, each METHOD + path gated verbatim against that page; schemas carry only the fields the page example responses show.
servers:
- url: https://api.suzanne3d.com
security:
- bearer: []
tags:
- name: Models
  description: Download finished meshes
paths:
  /v1/models/{job_id}/download:
    get:
      operationId: downloadModel
      tags:
      - Models
      summary: Download the mesh
      description: Returns a 302 Found redirect to a fresh 15-min presigned S3 URL for the requested format. Follow the redirect. The format must have been listed in the job outputs array. The URL is unguessable but not private; re-request anytime to mint a fresh one.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - glb
          - obj
          - stl
          - fbx
        description: The format must have been listed in the job outputs array.
      responses:
        '302':
          description: 302 Found redirect to a fresh 15-minute presigned S3 URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'not_found: no such job, or the requested format was not produced'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'job_not_done: poll GET /v1/jobs/{job_id} first'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://console.suzanne3d.com/documentation/download-model
      x-evidence:
        kind: documentation
        response_status_on_page: Returns a 302 Found redirect
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              enum:
              - invalid_request
              - auth
              - rate_limit
              - internal
              - vendor
            code:
              type: string
              description: machine-readable string
            message:
              type: string
            request_id:
              type: string
              description: Always include request_id in support requests.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <key>. Keys start with sznn_test_ (sandbox) or sznn_live_ (production). Server-side only.'
