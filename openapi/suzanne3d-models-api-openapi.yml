  title: Suzanne Models API
  version: '2026-10-07'
  description: 'Turn a text prompt or 1-4 photos into a textured 3D mesh. The API returns standard GLB (and optionally OBJ / STL / FBX). Submit a job, poll GET /v1/jobs/{job_id} until it is terminal, then download. Base URL: https://api.suzanne3d.com. GENERATED FROM DOCUMENTATION by API Evangelist; Suzanne publishes no machine-readable contract.'
