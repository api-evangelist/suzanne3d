openapi: 3.1.0
info:
  title: Suzanne API
  version: '2026-10-07'
  description: 'Turn a text prompt or 1-4 photos into a textured 3D mesh. The API returns standard GLB (and optionally OBJ
    / STL / FBX). Submit a job, poll GET /v1/jobs/{job_id} until it is terminal, then download. Base URL: https://api.suzanne3d.com.
    GENERATED FROM DOCUMENTATION by API Evangelist; Suzanne publishes no machine-readable contract.'
  x-evidence-tiers:
    code-example: 2
    documentation: 5
    pages-with-code: 4
    pages-read: 17
  x-generated-from: documentation
  x-provenance: generated
  x-authored-by: API Evangelist
  x-generated: '2026-10-07'
  x-generator: generate-contract-from-docs.py
  x-engine: anthropic
  x-sources:
  - https://console.suzanne3d.com/documentation
  - https://console.suzanne3d.com/documentation/errors
  - https://console.suzanne3d.com/documentation/quickstart
  - https://console.suzanne3d.com/documentation/authentication
  - https://console.suzanne3d.com/documentation/models
  - https://console.suzanne3d.com/documentation/atelier2
  - https://console.suzanne3d.com/documentation/parameters
  - https://console.suzanne3d.com/documentation/idempotency
  - https://console.suzanne3d.com/documentation/text-to-3d
  - https://console.suzanne3d.com/documentation/photo-to-3d
  - https://console.suzanne3d.com/documentation/uploads
  - https://console.suzanne3d.com/documentation/jobs
