apis:
- name: Suzanne API
  description: REST API for turning a text prompt or 1-4 photos into a textured 3D mesh. Jobs are submitted to POST /v1/generations/text-to-3d
    or /v1/generations/photo-to-3d against the sculptor, atelier or capture models, images are staged through presigned uploads
    (POST /v1/uploads), jobs are polled at GET /v1/jobs/{job_id}, can be cancelled, and finished meshes are downloaded as
    GLB, OBJ, STL or FBX via a 302 to a presigned URL. Bearer API keys (sznn_test_ / sznn_live_), an Idempotency-Key header
    on generation POSTs, and a JSON error envelope.
  image: https://kinlane-productions2.s3.amazonaws.com/apis-json-icons/api-evangelist-icon.png
