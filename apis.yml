aid: suzanne3d
name: Suzanne
image: https://suzanne3d.com/favicon.png
description: 'Suzanne (Suzanne 3D Inc., San Francisco) is an AI industrial-design platform that turns text prompts, photos
  and sketches into manufacturable 3D designs with physics and manufacturing intelligence built in. The Suzanne API at api.suzanne3d.com
  is a B2B surface for 3D mesh generation: submit a text-to-3D or photo-to-3D job against named models (sculptor, atelier,
  capture) powered by its in-house Atelier2 engine, poll the job, and download GLB, OBJ, STL or FBX output.'
