generated: '2026-10-07'
method: searched
source: https://console.suzanne3d.com/documentation/errors
format: custom-json-envelope
envelope:
  shape: '{ "error": { "type", "code", "message", "request_id" } }'
  fields:
    error.type: invalid_request | auth | rate_limit | internal | vendor
    error.code: machine-readable string
    error.message: human-readable explanation
    error.request_id: opaque id; always include request_id in support requests
note: HTTP-level error codes from the Error Reference plus the endpoint pages (job_not_done is documented on the
  download endpoint, not_found on the job endpoints). Job-level failure codes are in suzanne3d-error-codes.yml.
problems:
- status: 400
  title: validation_error
  type: validation_error
  description: Request body doesn't match the schema.
  remediation: Fix the request body; do not retry unchanged.
- status: 400
  title: missing_body
  type: missing_body
  description: POST without a JSON body.
  remediation: 'Send a JSON body with content-type: application/json.'
- status: 400
  title: invalid_param
  type: invalid_param
  description: faces value not in the allowed enum.
  remediation: Use one of 200000 / 500000 / 1000000 / 2000000.
- status: 400
  title: inline_multi_photo_not_supported
  type: inline_multi_photo_not_supported
  description: Multi-view inline isn't a thing; use images_upload_ids .
  remediation: Upload each view via POST /v1/uploads and reference the upl_ ids.
- status: 401
  title: unauthorized
  type: unauthorized
  description: Missing / bad API key.
  remediation: 'Send Authorization: Bearer sznn_test_... or sznn_live_...'
- status: 403
  title: forbidden_scope
  type: forbidden_scope
  description: Key lacks the required scope.
  remediation: Use a key issued with the required scope.
- status: 409
  title: idempotency_key_conflict
  type: idempotency_key_conflict
  description: Same Idempotency-Key with a different body.
  remediation: Use a fresh Idempotency-Key for a different request.
- status: 409
  title: concurrent_limit_reached
  type: concurrent_limit_reached
  description: Account is at the concurrent-jobs ceiling.
  remediation: Back off and retry.
- status: 409
  title: job_not_done
  type: job_not_done
  description: The job hasn't completed yet; poll GET /v1/jobs/{job_id} first.
  remediation: Poll the job until status is done before downloading.
- status: 404
  title: not_found
  type: not_found
  description: No such job, or it belongs to a different account.
  remediation: Check the job_id and the account the key belongs to.
- status: 500
  title: internal
  type: internal
  description: Server-side bug; please report.
  remediation: Retry; include request_id in the support request.
